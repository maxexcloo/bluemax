name: BlueBuild

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "00 06 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Check Image Changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" =~ ^(pull_request|push)$ ]] && [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            if [ -s "$RUNNER_TEMP/changed-files" ]; then
              build=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  .gitignore|AGENTS.md|LICENSE|README.md|files/edid/*|renovate.json5) ;;
                  *) build=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.build == 'true'
        name: Build Image
        uses: blue-build/github-action@v1
        with:
          cosign_private_key: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.SIGNING_SECRET || '' }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          recipe: recipe.yaml
          registry_token: ${{ github.token }}
          skip_checkout: "true"
