name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "00 06 * * *"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node@24 npm:renovate oxfmt ruff
      - name: Run Checks
        run: mise run check

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.recipes.outputs.recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: recipes
        name: Discover Recipes
        run: |
          recipes=$(find recipes -maxdepth 1 -name '*.yaml' | sed 's|^recipes/||; s|\.yaml$||' | sort | jq -Rnc '[inputs]')
          echo "recipes=$recipes" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.recipe }}
    needs: [checks, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.prepare.outputs.recipes) }}
    steps:
      - name: Build Image
        uses: blue-build/github-action@v1
        with:
          cosign_private_key: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.SIGNING_SECRET || '' }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          recipe: ${{ matrix.recipe }}.yaml
          registry_token: ${{ github.token }}

  check:
    if: always()
    name: Check
    runs-on: ubuntu-latest
    needs: [checks, prepare, build]
    steps:
      - name: Verify Checks & Builds
        run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
