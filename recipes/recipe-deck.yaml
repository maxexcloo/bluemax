---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
base-image: ghcr.io/ublue-os/bazzite-deck
description: Custom Bazzite Deck image for handheld gaming and remote access.
image-version: stable
name: bluemax-deck

modules:
  - from-file: common.yaml
  # Polaris replaces Sunshine for streaming.
  - type: dnf
    install:
      packages:
        # renovate: datasource=github-releases depName=papi-ux/polaris
        - https://github.com/papi-ux/polaris/releases/download/v1.4.13/Polaris-fedora%OS_VERSION%-x86_64.rpm
    remove:
      packages:
        - sunshine
  - type: files
    files:
      - destination: /
        source: deck
  - type: script
    snippets:
      - |
        for desktop_entry in \
          /usr/share/applications/bazzite-documentation.desktop \
          /usr/share/applications/bbrew.desktop \
          /usr/share/applications/discourse.desktop \
          /usr/share/applications/org.kde.kdebugsettings.desktop \
          /usr/share/applications/steam.desktop; do
          desktop-file-edit --set-key=NoDisplay --set-value=true "$desktop_entry"
        done
      # The packaged unit only starts with desktop autostart, which Game Mode skips.
      - systemctl --global add-wants default.target polaris.service
  - type: initramfs
  - type: signing
