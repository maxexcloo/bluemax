# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
base-image: ghcr.io/ublue-os/ucore
description: Custom uCore image for homelab servers.
image-version: stable
name: bluemax-ucore

modules:
  - type: brew
  - type: script
    snippets:
      - mkdir -p /var/usrlocal/bin
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://pkg.cloudflare.com/cloudflared.repo
    install:
      packages:
        - cloudflared
        - fish
        - syncthing
  - type: files
    files:
      - destination: /
        source: ucore
  - type: systemd
    system:
      enabled:
        - tailscaled.service
      masked:
        - cockpit.service
        - cockpit.socket
  - type: signing
