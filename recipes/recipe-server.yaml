# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
base-image: ghcr.io/ublue-os/ucore
description: Custom uCore image for homelab servers.
image-version: stable
name: bluemax-server

modules:
  - type: brew
  - type: dnf
    install:
      packages:
        - edk2-ovmf
        - fish
        - incus
        - incus-agent
        # Incus creates these devices even for headless x86-64 VMs.
        - qemu-audio-spice
        - qemu-char-spice
        - qemu-device-display-virtio-vga
        - qemu-device-usb-redirect
        - qemu-img
        - qemu-kvm-core
        - xorriso
  - type: files
    files:
      - destination: /
        source: common
      - destination: /
        source: server
  - type: systemd
    system:
      enabled:
        - tailscaled.service
      masked:
        - cockpit.service
        - cockpit.socket
  - type: signing
