# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
base-image: ghcr.io/ublue-os/ucore
description: Custom uCore image for homelab servers.
image-version: stable
name: bluemax-server

modules:
  - type: brew
  - type: dnf
    install:
      packages:
        - fish
        - syncthing
  - type: files
    files:
      - destination: /
        source: common
      - destination: /
        source: server
  - type: script
    snippets:
      - |
        set -eu
        mkdir -p /usr/lib/orca-server
        # renovate: datasource=github-releases depName=stablyai/orca
        curl -fsSL https://github.com/stablyai/orca/releases/download/v1.4.257/orca-server-linux-x64.tar.gz -o /tmp/orca-server.tar.gz
        tar -xzf /tmp/orca-server.tar.gz --strip-components=1 -C /usr/lib/orca-server
        rm /tmp/orca-server.tar.gz
        ln -s /usr/lib/orca-server/bin/orca-ide /usr/bin/orca-ide
  - type: systemd
    system:
      enabled:
        - tailscaled.service
      masked:
        - cockpit.service
        - cockpit.socket
  - type: signing
