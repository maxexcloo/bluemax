---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.github.zocker_160.SyncThingy
          - com.steamgriddb.steam-rom-manager
          - net.retrodeck.retrodeck
  - type: dnf
    install:
      packages:
        - kde-partitionmanager
    remove:
      packages:
        - "*fcitx5*"
        - "*rom-properties*"
        - filelight
        - gnome-disk-utility
        - kfind
        - "krdc*"
        - "krfb*"
        - kwrite
        - "libime*"
        - lutris
        - webapp-manager
  - type: script
    snippets:
      - |
        # renovate: datasource=forgejo-releases depName=eden-emu/eden
        version=v0.2.1
        curl -fLo /usr/bin/eden "https://stable.eden-emu.dev/$version/Eden-Linux-$version-amd64-clang-pgo.AppImage"
        chmod +x /usr/bin/eden
        cat > /usr/share/applications/eden.desktop <<EOF
        [Desktop Entry]
        Categories=Game;Emulator;
        Exec=eden %f
        Name=Eden
        Type=Application
        EOF
