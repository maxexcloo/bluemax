---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.github.zocker_160.SyncThingy
          - com.steamgriddb.steam-rom-manager
          - net.retrodeck.retrodeck
  - type: dnf
    install:
      packages:
        - kde-partitionmanager
    remove:
      packages:
        - "*fcitx5*"
        - "*rom-properties*"
        - filelight
        - gnome-disk-utility
        - kfind
        - "krdc*"
        - "krfb*"
        - kwrite
        - "libime*"
        - lutris
        - webapp-manager
  - type: script
    snippets:
      - |
        # Both emulators ship frequent builds, so each image takes the newest.
        install_appimage() {
          curl -fLo "/usr/bin/$1" "$3"
          chmod +x "/usr/bin/$1"
          printf '[Desktop Entry]\nCategories=Game;Emulator;\nExec=%s %%f\nName=%s\nType=Application\n' "$1" "$2" > "/usr/share/applications/$1.desktop"
        }
        install_appimage eden Eden "$(curl -fsS https://git.eden-emu.dev/api/v1/repos/eden-emu/eden/releases/latest | jq -r '.assets[] | select(.name | endswith("-amd64-clang-pgo.AppImage")) | .browser_download_url')"
        install_appimage eglantine Eglantine "$(curl -fsS 'https://api.github.com/repos/Djihads80/Eglantine/releases?per_page=10' | jq -r '[.[].assets[] | select(.name == "eglantine-linux-x86_64-pgo.AppImage")][0].browser_download_url')"
