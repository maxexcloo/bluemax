# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Reims Revision
pipelineid: update-reims-revision
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/steelbrain/reims-vgpu.git refs/heads/master | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: files/scripts/build-reims.sh
      matchpattern: (reims_revision=)[a-f0-9]{40}
      replacepattern: ${1}{{ source "version" }}
