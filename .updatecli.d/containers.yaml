# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Fedora Build Stages
pipelineid: update-fedora-build-stages
labels:
  group: containers
sources:
  version:
    kind: dockerimage
    spec:
      image: registry.fedoraproject.org/fedora
      tagfilter: ^[0-9]+$
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: recipes/recipe.yaml
      matchpattern: "(from: registry.fedoraproject.org/fedora:)[0-9]+"
      replacepattern: ${1}{{ source "version" }}
