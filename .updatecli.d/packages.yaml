# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Moonshine Release
pipelineid: update-moonshine-release
labels:
  group: packages
sources:
  package:
    kind: githubrelease
    spec:
      owner: hgaiser
      repository: moonshine
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
  version:
    kind: githubrelease
    spec:
      owner: hgaiser
      repository: moonshine
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  download:
    kind: file
    sourceid: version
    spec:
      file: recipes/recipe.yaml
      matchpattern: (https://github.com/hgaiser/moonshine/releases/download/)v[0-9.]+
      replacepattern: ${1}{{ source "version" }}
  rpm:
    kind: file
    sourceid: package
    spec:
      file: recipes/recipe.yaml
      matchpattern: (/moonshine-)[0-9.]+(-1\.x86_64\.rpm)
      replacepattern: ${1}{{ source "package" }}${2}
---
name: Update Polaris Release
pipelineid: update-polaris-release
labels:
  group: packages
sources:
  version:
    kind: githubrelease
    spec:
      owner: papi-ux
      repository: polaris
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  download:
    kind: file
    sourceid: version
    spec:
      file: recipes/recipe.yaml
      matchpattern: (https://github.com/papi\-ux/polaris/releases/download/)v[0-9.]+
      replacepattern: ${1}{{ source "version" }}
