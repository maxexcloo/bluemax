name = "macOS"
# Set this to the private interface address clients can reach.
address = "127.0.0.1"
application_scanner = []

[compositor]
hdr = false
steam_mode = false

[webserver]
certificate = "$HOME/.config/moonshine/cert.pem"
port = 48989
port_https = 48984
private_key = "$HOME/.config/moonshine/key.pem"

[stream]
port = 49010

[stream.audio]
port = 49000

[stream.control]
port = 48999

[stream.video]
port = 48998
max_packet_size = 1200

[[application]]
title = "macOS"
command = ["/usr/bin/reims-viewer", "mac"]
